<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ModelGraphGenerator logo">
  <!-- JSON bracket left -->
  <text x="2" y="46" font-family="'SF Mono', 'Fira Code', monospace" font-size="40" font-weight="700" fill="#66AAFF">{</text>
  <!-- JSON bracket right -->
  <text x="48" y="46" font-family="'SF Mono', 'Fira Code', monospace" font-size="40" font-weight="700" fill="#66AAFF">}</text>

  <!-- 3x3 grid of dots inside the brackets -->
  <!-- Row 1 -->
  <circle cx="22" cy="22" r="3" fill="#66AAFF" opacity="0.9"/>
  <circle cx="32" cy="22" r="3" fill="#66AAFF" opacity="0.9"/>
  <circle cx="42" cy="22" r="3" fill="#66AAFF" opacity="0.6"/>

  <!-- Row 2 -->
  <circle cx="22" cy="32" r="3" fill="#66AAFF" opacity="0.9"/>
  <circle cx="32" cy="32" r="4" fill="#66AAFF" opacity="1.0"/>
  <circle cx="42" cy="32" r="3" fill="#66AAFF" opacity="0.9"/>

  <!-- Row 3 -->
  <circle cx="22" cy="42" r="3" fill="#66AAFF" opacity="0.6"/>
  <circle cx="32" cy="42" r="3" fill="#66AAFF" opacity="0.9"/>
  <circle cx="42" cy="42" r="3" fill="#66AAFF" opacity="0.9"/>

  <!-- Connecting lines (graph edges) -->
  <line x1="22" y1="22" x2="32" y2="22" stroke="#66AAFF" stroke-width="1.5" opacity="0.4"/>
  <line x1="32" y1="22" x2="32" y2="32" stroke="#66AAFF" stroke-width="1.5" opacity="0.4"/>
  <line x1="32" y1="32" x2="42" y2="32" stroke="#66AAFF" stroke-width="1.5" opacity="0.4"/>
  <line x1="22" y1="32" x2="22" y2="42" stroke="#66AAFF" stroke-width="1.5" opacity="0.4"/>
  <line x1="32" y1="32" x2="42" y2="42" stroke="#66AAFF" stroke-width="1.5" opacity="0.4"/>
</svg>
